# Account-wide boundary; the authorized key also forces the same dispatcher.
Match User inventree-deploy
    ForceCommand /usr/local/libexec/myinventree-dev-ssh
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    GSSAPIAuthentication no
    HostbasedAuthentication no
    AuthorizedKeysFile /var/lib/inventree-deploy/.ssh/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    PermitUserEnvironment no
Match all
